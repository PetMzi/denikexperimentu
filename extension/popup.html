<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Saver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 340px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .header-badge {
      font-size: 10px;
      background: #1e40af;
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: #94a3b8; }

    .preview {
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .preview-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 6px;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-url {
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-excerpt {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .source-badge.linkedin { background: #1e3a5f; color: #60a5fa; }
    .source-badge.article  { background: #14532d; color: #4ade80; }
    .source-badge.other    { background: #1e1b4b; color: #a5b4fc; }

    .actions {
      padding: 14px 16px;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-save:hover:not(:disabled) { background: #1d4ed8; }
    .btn-save:active:not(:disabled) { transform: scale(0.98); }
    .btn-save:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      line-height: 1.4;
    }
    .status.success { color: #4ade80; }
    .status.error   { color: #f87171; }
    .status.loading { color: #60a5fa; }

    .loading-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #1e293b;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: #475569;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Article Saver</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="header-badge" id="sourceBadgeHeader"></span>
      <button class="settings-btn" id="settingsBtn" title="Nastavení">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="mainContent">
    <div class="preview" id="previewSection">
      <div class="preview-label">Náhled obsahu</div>
      <div id="previewInner">
        <div class="empty-state">Načítám stránku…</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-save" id="saveBtn" disabled>Uložit do Supabase</button>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
